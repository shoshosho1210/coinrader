name: Daily SNS Assets Preparation

on:
  schedule:
    # 毎日 日本時間 朝6:00（UTC 前日21:00）に実行
    - cron: "0 21 * * *"
  workflow_dispatch: # 手動実行ボタンも有効化

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run SNS Assets script
        run: |
          # SNS専用のスクリプトを実行
          python generate_sns_assets.py

      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # SNS関連の生成ファイルとHTMLをステージング
          git add daily_post_short.txt daily_image_overlay.txt daily_share_url.txt share/
          
          # 変更がある場合のみコミット
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update SNS assets and share page [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          else
            echo "No changes found."
          fi