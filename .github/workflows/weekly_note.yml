name: Weekly Market Intelligence

on:
  schedule:
    # 毎週日曜日 22:00 UTC = 月曜日 07:00 JST
    # これで「先週（月〜日）のデータ」が揃った状態でレポートが出せます
    - cron: "0 22 * * 0"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 過去のJSONを読み込むため、履歴を取得する必要があるか確認
          # ファイルが存在していれば fetch-depth: 1 でも動きますが、念のため安全策で
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate weekly intelligence report
        env:
          SITE_URL: "https://coinrader.net/"
          WEEK_DAYS: "7"
        run: |
          set -eux
          # データフォルダがあるか確認（初回などエラー回避）
          ls -R data/daily || echo "No data directory found yet"
          
          python generate_weekly_note.py
          
          # 生成確認
          test -f weekly_note_draft.md
          test -f weekly_summary.txt

      - name: Commit & Push report draft
        run: |
          set -eux
          git config user.name "coinrader-bot"
          git config user.email "coinrader-bot@users.noreply.github.com"

          # 生成物のみをadd
          git add weekly_note_draft.md weekly_summary.txt
          
          # 変更がある場合のみコミット
          if ! git diff --cached --quiet; then
            git commit -m "Update Weekly Intelligence Report Draft [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
