name: Daily Share Page

on:
  schedule:
    - cron: "0 * * * *"  # 毎時0分に実行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        env:
          CG_DEMO_KEY: ${{ secrets.CG_DEMO_KEY }} # APIキーが必要な場合はここに追加
        run: |
          mkdir -p data/daily
          mkdir -p share
          python generate_daily_post_v2.py

          # ★追加：生成された最新の日付JSONをlatest.jsonにコピー
          # 日付付きのファイル（例: 20260131.json）を latest.json として上書き保存します
          LATEST_FILE=$(ls -t data/daily/[0-9]*.json | head -1)
          cp "$LATEST_FILE" data/daily/latest.json
          echo "Updated latest.json with $LATEST_FILE"
          
      # --- 60日経過したファイルの自動削除 ---
      - name: Prune old files (keep last 60 days)
        env:
          KEEP_DAYS: "60"
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime as dt, os, re

          keep = int(os.getenv("KEEP_DAYS", "60"))
          # 実行時の日付から60日前を計算
          cutoff = (dt.datetime.now(dt.timezone.utc).date() - dt.timedelta(days=keep))

          # 削除対象の設定 (フォルダ, 拡張子)
          targets = [
              (Path("share"), "*.html"),
              (Path("data/daily"), "*.json")
          ]

          removed = 0
          for folder, pattern in targets:
              if not folder.exists():
                  continue

              for p in folder.glob(pattern):
                  # ファイル名から日付（数字8桁）を探す
                  m = re.search(r"(\d{8})", p.name)
                  if not m:
                      continue
                  
                  try:
                      file_date = dt.datetime.strptime(m.group(1), "%Y%m%d").date()
                      # 設定日数より古ければ削除
                      if file_date < cutoff:
                          p.unlink()
                          removed += 1
                          print(f"Deleted old file: {p}")
                  except Exception as e:
                      print(f"Error parsing date in {p.name}: {e}")

          print(f"✅ Pruned {removed} file(s) older than {keep} days.")
          PY
      # --- ここまで追加 ---

      - name: Commit and Push
        env:
          # ★修正1：GitHubトークンを環境変数に入れる
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          # ★修正2：ボット用ユーザー設定（グローバル設定の方が確実）
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 変更（生成および削除）をすべてステージング
          git add data/daily/ share/ *.txt *.md
          
          # 変更がある場合のみコミット＆プッシュ（トークン付きURL）
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update daily data and prune old files [skip ci]"
            # ★修正3：トークン付きURLでプッシュ
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          else
            echo "No changes found."
          fi
