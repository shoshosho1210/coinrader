name: Daily Share Page

on:
  schedule:
    # 毎時13分・43分に実行（混雑しやすい時間を避ける）
    # 日本時間（JST）では 毎時13分/43分頃に動く設定です
    - cron: "13,43 * * * *"
  workflow_dispatch:

# 並走による生成物の競合を防ぐ（手動RUNとcronが被っても片方をキャンセル）
concurrency:
  group: daily-share-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 先に最新mainを取り込んでから生成（rebase競合を避ける）
      - name: Sync with origin/main
        run: |
          set -eux
          git pull --rebase origin main

      - name: Run script
        env:
          CG_DEMO_KEY: ${{ secrets.CG_DEMO_KEY }} # APIキーが必要な場合はここに追加
        run: |
          mkdir -p data/daily
          mkdir -p data/intraday/raw
          mkdir -p share
          python generate_daily_post_v2.py

          # ★互換：生成された最新の日付JSONをlatest.jsonにコピー（保険）
          LATEST_FILE=$(ls -t data/daily/[0-9]*.json | head -1)
          cp "$LATEST_FILE" data/daily/latest.json
          echo "Updated latest.json with $LATEST_FILE"

      - name: Prune old files (daily=90d, intraday=14d)
        env:
          KEEP_DAYS: "90"
          INTRADAY_KEEP_DAYS: "14"
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime as dt, os, re

          keep_daily = int(os.getenv("KEEP_DAYS", "90"))
          keep_intra = int(os.getenv("INTRADAY_KEEP_DAYS", "14"))

          today_utc = dt.datetime.now(dt.timezone.utc).date()
          cutoff_daily = today_utc - dt.timedelta(days=keep_daily)
          cutoff_intra = today_utc - dt.timedelta(days=keep_intra)

          removed = 0

          # daily/share: ファイル名にYYYYMMDDが入るものを削除
          targets_daily = [
              (Path("share"), "*.html", cutoff_daily),
              (Path("data/daily"), "*.json", cutoff_daily),
          ]

          for folder, pattern, cutoff in targets_daily:
              if not folder.exists():
                  continue
              for p in folder.glob(pattern):
                  m = re.search(r"(\d{8})", p.name)
                  if not m:
                      continue
                  try:
                      file_date = dt.datetime.strptime(m.group(1), "%Y%m%d").date()
                      if file_date < cutoff:
                          p.unlink()
                          removed += 1
                          print(f"Deleted old file: {p}")
                  except Exception as e:
                      print(f"Error parsing date in {p.name}: {e}")

          # intraday/raw: YYYYMMDD_HHMM.json の日付部分で削除
          folder = Path("data/intraday/raw")
          if folder.exists():
              for p in folder.glob("*.json"):
                  m = re.search(r"(\d{8})", p.name)
                  if not m:
                      continue
                  try:
                      file_date = dt.datetime.strptime(m.group(1), "%Y%m%d").date()
                      if file_date < cutoff_intra:
                          p.unlink()
                          removed += 1
                          print(f"Deleted old intraday: {p}")
                  except Exception as e:
                      print(f"Error parsing date in {p.name}: {e}")

          print(f"✅ Pruned {removed} file(s). daily_keep={keep_daily}d intraday_keep={keep_intra}d")
          PY

      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/daily/ data/intraday/ share/

          if [ -n "$(git status --porcelain data/daily/ data/intraday/ share/)" ]; then
            git commit -m "Update hourly market JSON [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          else
            echo "No changes. Skipping commit."
          fi
