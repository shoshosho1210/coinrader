name: Build Daily Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily pages
        env:
          CR_SITE_ORIGIN: https://coinrader.net
        run: |
          python scripts/build_daily_pages.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # daily/tags が .gitignore 対象でも確実に含める
          git add -A daily sitemap.xml
          git add -f daily/tags/*.html

          git commit -m "chore: generate daily pages" || echo "No changes to commit"
          git push

      - name: Debug bear.html snippet
        run: |
          echo "---- grep taghead ----"
          grep -n "taghead" -n daily/tags/bear.html || true
          echo "---- grep /daily/ links ----"
          grep -n "/daily/" daily/tags/bear.html || true
          echo "---- show around taghead ----"
          awk 'NR>=1 && NR<=220 {print}' daily/tags/bear.html | sed -n '150,210p'
