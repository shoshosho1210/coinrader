name: Build Daily Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily pages
        env:
          CR_SITE_ORIGIN: https://coinrader.net
        run: |
          python scripts/build_daily_pages.py

      # ★追加：coinsを生成
      - name: Generate coin pages
        env:
          CR_SITE_ORIGIN: https://coinrader.net
        run: |
          python scripts/build_coin_pages.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "---- ls coins ----"
          ls -la coins coins/btc || true
          ls -la coins/btc/index.html || true

          echo "---- check ignore ----"
          git check-ignore -v coins/btc/index.html || echo "coins/btc/index.html is NOT ignored"

          # daily/tags が .gitignore 対象でも確実に含める
          git add -A daily sitemap.xml
          git add -f daily/tags/*.html

          # ★coins が .gitignore 対

      - name: Debug bear.html snippet
        run: |
          echo "---- grep taghead ----"
          grep -n "taghead" -n daily/tags/bear.html || true
          echo "---- grep /daily/ links ----"
          grep -n "/daily/" daily/tags/bear.html || true
          echo "---- show around taghead ----"
          awk 'NR>=1 && NR<=220 {print}' daily/tags/bear.html | sed -n '150,210p'
