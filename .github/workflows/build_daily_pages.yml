name: Build Daily Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate daily pages
        env:
          CR_SITE_ORIGIN: https://coinrader.net
        run: |
          python scripts/build_daily_pages.py

      - name: Check daily html links (no .html)
        run: |
          echo "---- grep .html under /daily/ in generated daily/ ----"
          grep -RIn "/daily/.*\.html" daily | head -n 50 || true
          grep -RIn "/daily/.*\.html" daily || true
          grep -RIn "/daily/.*\.html" daily --include="*.html" | head
          find daily/tags -maxdepth 1 -type f ! -name "*.html" -print
          echo "---- remove legacy extensionless tag files ----"
          ls -la daily/tags || true
          rm -f daily/tags/bear daily/tags/bull daily/tags/wait
          echo "---- after rm ----"
          ls -la daily/tags || true
          git status --porcelain
          echo "---- grep /daily/*.html in daily/*.html ----"
          grep -RIn "/daily/.*\.html" daily --include="*.html" | head -n 50

      - name: Sanity check daily links
        run: |
          set -eux
          echo "---- grep /daily/*.html in daily/*.html ----"
          grep -RIn "/daily/.*\.html" daily --include="*.html" | head -n 50
          echo "---- non-html files under daily/tags (must be empty) ----"
          find daily/tags -maxdepth 1 -type f ! -name "*.html" -print
          echo "---- grep extensionless daily links ----"
          grep -RInE "/daily/[0-9]{8}([^.]|$)" daily --include="*.html" | head -n 50
          echo "---- tag canonical must be extensionless ----"
          grep -RIn "rel=\"canonical\" href=\"https://coinrader.net/daily/tags/.*\.html" daily/tags --include="*.html" || true
          set -eux

          set -eux

          echo "---- reject /daily/*.html in href/content/canonical ----"
          # href="/daily/... .html" または href='/daily/... .html'
          # content="https://.../daily/... .html" も対象（og:url等）
          if grep -RInE "href=['\"]/daily/[^'\"]+\.html(['\"#?]|$)|content=['\"][^'\"]*/daily/[^'\"]+\.html(['\"#?]|$)" \
            daily --include="*.html"
          then
            echo "FOUND legacy .html links under /daily/"
            exit 1
          fi

          echo "---- require extensionless /daily/YYYYMMDD links exist (sanity) ----"
          grep -RInE "/daily/[0-9]{8}([^.]|$)" daily --include="*.html" | head -n 30 || true

          echo "---- tags dir must not contain non-html files ----"
          test -z "$(find daily/tags -maxdepth 1 -type f '!' -name '*.html' -print)"

          echo "---- tags canonical must be extensionless (no .html) ----"
          if grep -RInE 'rel="canonical" href="https://coinrader\.net/daily/tags/[^"]+\.html"' daily/tags --include="*.html"
          then
            echo "FOUND .html canonical under /daily/tags/"
            exit 1
          fi


      - name: Validate sitemap (canonical-only)
        run: |
          python scripts/validate_sitemap.py --fix
          
          
      - name: Fetch coin snapshots (for /coins/* pages)
        env:
          CR_COINGECKO_KEY: ${{ secrets.CG_DEMO_KEY }}
        run: |
          mkdir -p data/coins
          python scripts/fetch_coin_snapshots.py

      # ★追加：coinsを生成
      - name: Generate coin pages
        env:
          CR_SITE_ORIGIN: https://coinrader.net
          CR_COINGECKO_KEY: ${{ secrets.CG_DEMO_KEY }}
        run: |
          python scripts/build_coin_pages.py

      - name: Debug coin page headers (after build)
        run: |
          echo "---- grep x-cg-demo-api-key ----"
          grep -n "x-cg-demo-api-key" coins/btc/index.html || true
          echo "---- grep fetch headers ----"
          grep -n "fetch(url" coins/btc/index.html || true
          grep -n "headers\\[" coins/btc/index.html || true
          echo "---- grep CG_KEY ----"
          grep -n "const CG_KEY" coins/btc/index.html || true

      - name: Debug env for coin build
        run: |
          echo "CR_COINGECKO_KEY length: ${#CR_COINGECKO_KEY}"
        env:
          CR_COINGECKO_KEY: ${{ secrets.CG_DEMO_KEY }}

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "---- ls coins ----"
          ls -la coins coins/btc || true
          ls -la coins/btc/index.html || true

          echo "---- check ignore ----"
          git check-ignore -v coins/btc/index.html && echo "(ignored)" || echo "coins/btc/index.html is NOT ignored"

          git add -A daily sitemap.xml
          git add -f daily/tags/*.html
          git add -A coins
          git add -A data/coins

          echo "---- status (porcelain) ----"
          git status --porcelain

          echo "---- check ignore (data/coins) ----"
          git check-ignore -v data/coins/*.json && echo "(ignored)" || echo "data/coins/*.json is NOT ignored"

          git commit -m "chore: generate daily & coin pages" || echo "No changes to commit"
          git push

      - name: Debug bear.html snippet
        run: |
          echo "---- grep taghead ----"
          grep -n "taghead" -n daily/tags/bear.html || true
          echo "---- grep /daily/ links ----"
          grep -n "/daily/" daily/tags/bear.html || true
          echo "---- show around taghead ----"
          awk 'NR>=1 && NR<=220 {print}' daily/tags/bear.html | sed -n '150,210p'

      - name: Debug coin key injection
        run: |
          grep -n "CG_KEY" coins/btc/index.html || true
          grep -n "x-cg-demo-api-key" coins/btc/index.html || true

      - name: Debug git diff (coins)
        run: |
          git status --porcelain
          git diff --name-only || true
          git diff -- coins/btc/index.html | head -n 80 || true

      - name: Debug coin snapshot url in generated page
        run: |
          echo "---- grep data/coins ----"
          grep -n "data/coins" coins/btc/index.html || true
          echo "---- grep api.coingecko.com ----"
          grep -n "api.coingecko.com" coins/btc/index.html || true

      - name: Debug one snapshot JSON
        run: |
          echo "---- head data/coins/btc.json ----"
          head -c 800 data/coins/btc.json; echo
          grep -n "fetch(snapUrl" -n coins/btc/index.html || true
          grep -n "const m" -n coins/btc/index.html || true
          grep -n "snap\\.market" -n coins/btc/index.html || true

      - name: Debug sitemap after build
        run: |
          echo "---- grep /daily/index.html ----"
          grep -n "/daily/index.html" sitemap.xml || echo "OK: not found"
          echo "---- diff sitemap.xml ----"
          git diff -- sitemap.xml || true
          echo "---- show head sitemap.xml ----"
          head -n 40 sitemap.xml

      - name: Debug sitemap hash
        run: |
          python - << 'PY'
          import hashlib, pathlib
          p = pathlib.Path("sitemap.xml")
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          print("sitemap.sha256=", h)
          print("size=", p.stat().st_size)
          PY





