name: Build Daily Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 並走で「fetch first」になりやすいので、同時実行を潰す
concurrency:
  group: build-pages-main
  cancel-in-progress: true

jobs:
  build-daily:
    # bot が生成物を push したコミットでは再起動しない（ループ＆競合防止）
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    # git push するので write が必要
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # rebase / pull --rebase に必要
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Cleanup legacy tag files
        run: |
          rm -f daily/tags/bear daily/tags/bull daily/tags/wait || true

      - name: Verify build_daily_pages.py has COINS_ALIAS_SLUGS (sanity)
        run: |
          set -eux
          grep -n "COINS_ALIAS_SLUGS" scripts/build_daily_pages.py || true

      # ★ ここで先に同期（クリーンな状態で rebase するのが重要）
      - name: Sync with origin/main (before build)
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Generate daily pages
        env:
          CR_SITE_ORIGIN: https://coinrader.net
        run: |
          python scripts/build_top_cache.py
          python scripts/build_daily_pages.py

      - name: Generate dictionary pages
        env:
          CR_SITE_ORIGIN: https://coinrader.net
        run: |
          python scripts/build_dictionary_pages.py

      - name: Sanity check dictionary canonical aliases
        run: |
          set -eux
          # Defensive cleanup: legacy alias should never ship as a real page
          rm -rf dictionary/fear-and-greed || true
          test -z "$(find dictionary -maxdepth 2 -path 'dictionary/fear-and-greed/index.html' -print)"
          
      - name: Check daily html links (no .html)
        run: |
          set -eux
          echo "---- grep .html under /daily/ in generated daily/ ----"
          grep -RIn "/daily/.*\.html" daily --include="*.html" | head -n 50 || true
          find daily/tags -maxdepth 1 -type f ! -name "*.html" -print || true

          echo "---- remove legacy extensionless tag files ----"
          rm -f daily/tags/bear daily/tags/bull daily/tags/wait || true
          ls -la daily/tags || true

          echo "---- grep /daily/*.html in daily/*.html ----"
          grep -RIn "/daily/.*\.html" daily --include="*.html" | head -n 50 || true

      - name: Sanity check daily links
        run: |
          set -eux
          echo "---- reject /daily/*.html in href/content/canonical ----"
          if grep -RInE "href=['\"]/daily/[^'\"]+\.html(['\"#?]|$)|content=['\"][^'\"]*/daily/[^'\"]+\.html(['\"#?]|$)" \
            daily --include="*.html"
          then
            echo "FOUND legacy .html links under /daily/"
            exit 1
          fi

          echo "---- tags dir must not contain non-html files ----"
          test -z "$(find daily/tags -maxdepth 1 -type f '!' -name '*.html' -print)"

          echo "---- tags canonical must be extensionless (no .html) ----"
          if grep -RInE 'rel="canonical" href="https://coinrader\.net/daily/tags/[^"]+\.html"' daily/tags --include="*.html"
          then
            echo "FOUND .html canonical under /daily/tags/"
            exit 1
          fi

          echo "---- require extensionless /daily/YYYYMMDD links exist (count) ----"
          cnt=$(grep -RInE "/daily/[0-9]{8}([^.]|$)" daily --include="*.html" | wc -l)
          test "$cnt" -gt 0
          echo "found: $cnt"

          echo "---- reject /daily/tags/*.html in href/content/canonical ----"
          if grep -RInE "href=['\"]/daily/tags/[^'\"]+\.html(['\"#?]|$)|content=['\"][^'\"]*/daily/tags/[^'\"]+\.html(['\"#?]|$)" \
            daily --include="*.html"
          then
            echo "FOUND legacy .html links under /daily/tags/"
            exit 1
          fi

          echo "---- _redirects legacy html rules (optional) ----"
          if [ -f _redirects ]; then
            grep -nE "^/daily/.*\.html|^/daily/tags/.*\.html" _redirects || true
          fi

      - name: Fetch coin snapshots (for /coins/* pages)
        env:
          CR_COINGECKO_KEY: ${{ secrets.CG_DEMO_KEY }}
        run: |
          mkdir -p data/coins
          python scripts/fetch_coin_snapshots.py
          
      - name: Generate coin pages
        env:
          CR_SITE_ORIGIN: https://coinrader.net
          CR_COINGECKO_KEY: ${{ secrets.CG_DEMO_KEY }}
        run: |
          python scripts/build_coin_pages.py

      - name: Build sitemap.xml (static + daily lastmod + coins)
        env:
          CR_SITE_ORIGIN: https://coinrader.net
        run: |
          set -eux
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          ORIGIN = 'https://coinrader.net'
          DICT_ALIAS_SLUGS = {'fear-and-greed'}

          def ymd2iso(ymd: str) -> str:
              return f"{ymd[0:4]}-{ymd[4:6]}-{ymd[6:8]}"

          def make_urlset(entries):
              body = []
              for loc, lastmod in entries:
                  if lastmod:
                      body.append(f"<url><loc>{loc}</loc><lastmod>{lastmod}</lastmod></url>")
                  else:
                      body.append(f"<url><loc>{loc}</loc></url>")
              return (
                  '<?xml version="1.0" encoding="UTF-8"?>'
                  '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
                  + '
                  '.join(body)
                  + '
                  </urlset>'
              )

          
          # ---- daily ids ----
          daily_ids = []
          for fp in sorted((ROOT / 'data/daily').glob('*.json')):
              m = re.fullmatch(r'(\d{8})\.json', fp.name)
              if m:
                  daily_ids.append(m.group(1))
          latest = daily_ids[-1] if daily_ids else None

          # ---- static/hub urls ----
          static_paths = [
              '/', '/about', '/start', '/data-sources', '/ads-pr', '/privacy', '/disclaimer', '/contact',
              '/coins/', '/dictionary/', '/guide/',          
          ]
          static_entries = []

          seen = set()
          for u in static_paths:
              if u in seen:
                  continue
              seen.add(u)
              static_entries.append((f"{ORIGIN}{u}", None))

          # guide pages
          guide_dir = ROOT / 'guide'
          if guide_dir.exists():
              for pdir in sorted(guide_dir.glob('*/')):
                  if (pdir / 'index.html').exists():
                      static_entries.append((f"{ORIGIN}/guide/{pdir.name}/", None))

          # coins pages
          coins_dir = ROOT / 'coins'
          if coins_dir.exists():
              for pdir in sorted(coins_dir.glob('*/')):
                  if (pdir / 'index.html').exists():
                      static_entries.append((f"{ORIGIN}/coins/{pdir.name}/", None))

          # dictionary pages (separate sitemap)
          dictionary_entries = []
          dict_dir = ROOT / 'dictionary'
          if dict_dir.exists():
              for pdir in sorted(dict_dir.glob('*/')):
                  slug = pdir.name.rstrip('/')
                  if slug in DICT_ALIAS_SLUGS:
                      continue
                  if (pdir / 'index.html').exists():
                      dictionary_entries.append((f"{ORIGIN}/dictionary/{slug}/", None))

          # ---- daily urls ----
          daily_entries = []              
          if latest:
              lm_latest = ymd2iso(latest)
              for u in ('/daily/', '/daily/tags/bear', '/daily/tags/bull', '/daily/tags/wait'):
                  daily_entries.append((f"{ORIGIN}{u}", lm_latest))
          for ymd in daily_ids:
              daily_entries.append((f"{ORIGIN}/daily/{ymd}", ymd2iso(ymd)))

          # write split sitemaps
          Path('sitemap-static.xml').write_text(make_urlset(static_entries), encoding='utf-8')
          Path('sitemap-dictionary.xml').write_text(make_urlset(dictionary_entries), encoding='utf-8')
          Path('sitemap-daily.xml').write_text(make_urlset(daily_entries), encoding='utf-8')

          # write sitemap index
          index_xml = (
              '<?xml version="1.0" encoding="UTF-8"?>'
              '<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
              f'  <sitemap><loc>{ORIGIN}/sitemap-static.xml</loc></sitemap>'
              f'  <sitemap><loc>{ORIGIN}/sitemap-dictionary.xml</loc></sitemap>'
              f'  <sitemap><loc>{ORIGIN}/sitemap-daily.xml</loc></sitemap>'
              '</sitemapindex>'
          )
          Path('sitemap.xml').write_text(index_xml, encoding='utf-8')
          print(f"wrote split sitemaps: static={len(static_entries)} dictionary={len(dictionary_entries)} daily={len(daily_entries)} latest={latest}")
          PY

      - name: Validate sitemap (canonical-only)
        run: |
          python scripts/validate_sitemap.py

      # debug は canonical 側（bitcoin）を見る
      - name: Debug coin page headers (after build)
        run: |
          echo "---- list coins ----"
          ls -la coins || true
          echo "---- grep x-cg-demo-api-key (if embedded) ----"
          grep -n "x-cg-demo-api-key" coins/bitcoin/index.html || true
          echo "---- grep CG_KEY ----"
          grep -n "const CG_KEY" coins/bitcoin/index.html || true


      - name: Ensure IndexNow key file (optional)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -eux
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "INDEXNOW_KEY not set; skip."
            exit 0
          fi
          echo "${INDEXNOW_KEY}" > indexnow_key.txt

      - name: Commit generated pages
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ★ ここが重要：push直前に「autostash付きrebase」で最新を取り込む
          # （生成物がある＝未コミット変更がある状態でも安全に rebase できる）
          git pull --rebase --autostash origin main

          # alias 残骸の掃除（必要なものだけ追加。例：coins/sol を消したい場合）
          rm -rf coins/sol || true
          git add -A daily sitemap.xml _redirects
          git add -f daily/tags/*.html
          git add -A coins
          git add -A data/coins
          git add -A dictionary
          git add -f data/top_cache.json
          git add -A indexnow_key.txt || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: generate daily & coin pages"
          git push origin HEAD:main

      - name: Inspect sitemap after build
        run: |
          set -eux
          ls -la sitemap.xml
          tail -n 5 sitemap.xml
          echo "=== grep alias (should be empty) ==="
          grep -n "coins/btc" sitemap.xml || echo "OK: no btc"
          grep -n "coins/eth" sitemap.xml || echo "OK: no eth"
          grep -n "coins/sol" sitemap.xml || echo "OK: no sol"


      - name: Notify IndexNow (optional)
        env:
          CR_SITE_ORIGIN: https://coinrader.net
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -eux
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "INDEXNOW_KEY not set; skip."
            exit 0
          fi
          # 8桁日付のjsonだけを拾う（latest.json等を除外）
          latest=$(
            ls -1 data/daily/*.json \
            | sed 's#.*/##' \
            | sed 's/\.json$//' \
            | grep -E '^[0-9]{8}$' \
            | sort \
            | tail -n 1
          )

          echo "latest daily: ${latest}"
          test -n "${latest}"

          cat > /tmp/indexnow.json <<EOF
          {
            "host": "coinrader.net",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "${CR_SITE_ORIGIN}/indexnow_key.txt",
            "urlList": [
              "${CR_SITE_ORIGIN}/daily/${latest}",
              "${CR_SITE_ORIGIN}/daily/",
              "${CR_SITE_ORIGIN}/daily/latest",
              "${CR_SITE_ORIGIN}/sitemap.xml"
            ]
          }
          EOF

          curl -sS -D /tmp/indexnow_headers.txt \
            -o /tmp/indexnow_body.txt \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/indexnow.json

          echo "---- IndexNow status ----"
          head -n 1 /tmp/indexnow_headers.txt || true
          echo "---- IndexNow body ----"
          cat /tmp/indexnow_body.txt || true
