<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>XRP (XRP) 今日の指標・市況まとめ | CoinRader</title>
  <meta name="description" content="XRP (XRP) の価格・24h/7d変動・出来高・時価総額などをまとめて確認。毎日更新。CoinRader。" />
  <link rel="canonical" href="https://coinrader.net/coins/xrp/" />
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial; background:#0f172a; color:#e5e7eb; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
    a { color:#7dd3fc; text-decoration:none; }
    a:hover { text-decoration: underline; }
    .muted { color:#94a3b8; }
    .h1 { font-size: 22px; font-weight: 800; margin: 10px 0 6px; }
    .sub { font-size: 13px; color:#94a3b8; margin-bottom: 16px; }
    .grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; }
    @media (max-width: 720px){ .grid { grid-template-columns: 1fr; } }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(148,163,184,0.18); border-radius: 14px; padding: 14px; }
    .k { font-size: 12px; color:#94a3b8; }
    .v { font-size: 20px; font-weight: 800; margin-top: 6px; }
    .sep { height:1px; background: rgba(148,163,184,0.18); margin: 14px 0; }
    .err { color: #fca5a5; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="muted"><a href="/">トップ</a> / <a href="/coins/">Coins</a> / XRP</div>
    <h1 class="h1">XRP (XRP)</h1>
    <div class="sub">主要指標の簡易表示。マーケット全体は <a href="/daily/latest.html">/daily/latest.html</a>。</div>

    <div class="grid">
      <div class="card"><div class="k">価格 (JPY)</div><div class="v" id="price">--</div><div class="muted" id="price_sub"></div></div>
      <div class="card"><div class="k">24h / 7d 変動</div><div class="v" id="chg">--</div><div class="muted" id="chg_sub"></div></div>
      <div class="card"><div class="k">出来高 (24h)</div><div class="v" id="vol">--</div><div class="muted">取引の活発度の目安</div></div>
      <div class="card"><div class="k">時価総額</div><div class="v" id="mcap">--</div><div class="muted">市場規模の目安</div></div>
    </div>

    <div class="sep"></div>

    <div class="card">
      <div class="k">メモ</div>
      <div class="muted" id="memo">読み込み中…</div>
      <div class="err" id="err"></div>
    </div>
  </div>

<script>
  const COIN_ID = "ripple";
  const CG_KEY = ""; // ★ビルド時に埋め込み（空なら未設定）

  const fmtJPY = (n) => (n == null || isNaN(n)) ? "--" : Number(n).toLocaleString("ja-JP",{maximumFractionDigits:0})+"円";
  const fmtPct = (n) => (n == null || isNaN(n)) ? "--" : ((n>=0?"+":"")+Number(n).toFixed(2)+"%");
  const fmtJPYBig = (n) => {
    if (n == null || isNaN(n)) return "--";
    const x = Number(n);
    if (x >= 1e12) return (x/1e12).toFixed(2) + "兆円";
    if (x >= 1e9)  return (x/1e9).toFixed(2) + "十億円";
    return x.toLocaleString("ja-JP",{maximumFractionDigits:0}) + "円";
  };

  async function main(){
    try{
      const url = "https://api.coingecko.com/api/v3/coins/markets"
        + "?vs_currency=jpy&ids=" + encodeURIComponent(COIN_ID)
        + "&price_change_percentage=24h,7d";

      const headers = {};
      if (CG_KEY && CG_KEY !== "") {
        headers["x-cg-demo-api-key"] = CG_KEY;
      }

      const r = await fetch(url, { headers, cache: "no-store" });

      if(!r.ok) throw new Error("CoinGecko fetch failed: " + r.status);
      const j = await r.json();
      if(!Array.isArray(j) || !j[0]) throw new Error("CoinGecko empty");
      const m = j[0];

      document.getElementById("price").textContent = fmtJPY(m.current_price);
      document.getElementById("price_sub").textContent = "高値/安値(24h): " + fmtJPY(m.high_24h) + " / " + fmtJPY(m.low_24h);
      document.getElementById("chg").textContent = fmtPct(m.price_change_percentage_24h) + " / " + fmtPct(m.price_change_percentage_7d_in_currency);
      document.getElementById("chg_sub").textContent = "ATH比: " + fmtPct(m.ath_change_percentage);
      document.getElementById("vol").textContent = fmtJPYBig(m.total_volume);
      document.getElementById("mcap").textContent = fmtJPYBig(m.market_cap);

      const tone = (m.price_change_percentage_24h >= 0) ? "上向き" : "下向き";
      document.getElementById("memo").textContent = "簡易判定: " + tone + "（24h変動ベース）";
    }catch(e){
      document.getElementById("err").textContent = String(e?.message || e);
      document.getElementById("memo").textContent = "データ取得に失敗しました。";
    }
  }
  main();
</script>
</body>
</html>
