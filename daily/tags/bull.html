  <script>
    // --- page filter (client-side) ---
    const q = document.getElementById('q');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const shownEl = document.getElementById('shown');
    const totalEl = document.getElementById('total');

    function normalize(s){
      return (s || '').toLowerCase().replace(/\s+/g,' ').trim();
    }

    function apply(){
      const term = normalize(q.value);
      const rows = [...list.querySelectorAll('.row')];
      totalEl.textContent = String(rows.length);

      let shown = 0;
      rows.forEach(row=>{
        const text = normalize(row.innerText);
        const ok = !term || text.includes(term);
        row.style.display = ok ? '' : 'none';
        if(ok) shown++;
      });

      shownEl.textContent = String(shown);
      empty.style.display = shown ? 'none' : 'block';
    }

    q.addEventListener('input', apply);
    window.addEventListener('DOMContentLoaded', apply);
  </script>

  <!-- ★追加：言語切替（data-i18n + placeholder 対応） -->
  <script>
  (function(){
    const btn = document.getElementById('langToggle');
    if(!btn) return;

    const KEY = 'cr_lang';
    const saved = localStorage.getItem(KEY) || document.documentElement.lang || 'ja';

    function applyLang(lang){
      document.documentElement.lang = lang;
      btn.textContent = (lang === 'en') ? 'JP' : 'EN';
      btn.setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');

      // text nodes
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const ja = el.getAttribute('data-ja');
        const en = el.getAttribute('data-en');
        if(!ja || !en) return;
        el.textContent = (lang === 'en') ? en : ja;
      });

      // placeholders (minimum)
      const q = document.getElementById('q');
      if(q){
        const phJa = q.getAttribute('data-ph-ja');
        const phEn = q.getAttribute('data-ph-en');
        if(phJa && phEn){
          q.setAttribute('placeholder', (lang === 'en') ? phEn : phJa);
        }
      }
    }

    btn.addEventListener('click', ()=>{
      const next = (document.documentElement.lang === 'en') ? 'ja' : 'en';
      localStorage.setItem(KEY, next);
      applyLang(next);
    });

    applyLang(saved);
  })();
  </script>
