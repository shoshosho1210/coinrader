<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daily AIレポート一覧 | CoinRader</title>
  <meta name="description" content="CoinRaderの日次AIレポート一覧。最新日から過去へ遡って閲覧できます。" />
  <link rel="canonical" href="https://coinrader.net/daily/" />
  <style>
    :root{--bg:#0f172a;--fg:#e5e7eb;--muted:#94a3b8;--line:#1f2937;--accent:#38bdf8;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg);}
    .wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px;}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    h1{font-size:26px;margin:10px 0 6px}
    .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
    .list{border-top:1px solid var(--line)}
    .row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
    .date{font-weight:800}
    .meta{color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div style="color:var(--muted);font-size:13px"><a href="/">CoinRader</a> / Daily</div>
    <h1>Daily AIレポート一覧</h1>
    <div class="sub">最新: <a href="/daily/latest.html">latest</a></div>
    <div class="list">
      {{ROWS}}
    </div>
  </div>
</body>
</html>
