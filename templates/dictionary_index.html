<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>用語集 | CoinRader</title>
  <meta name="description" content="CoinRaderの暗号資産・指標用語集。RSI、Fear&Greed、移動平均などを短く解説。" />
  <link rel="canonical" href="{{CANONICAL}}" />
  <style>
    :root{--bg:#0f172a;--fg:#e5e7eb;--muted:#94a3b8;--line:#1f2937;--accent:#38bdf8;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg)}
    .wrap{max-width:980px;margin:0 auto;padding:18px 16px 44px}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
    .brand{display:flex;gap:10px;align-items:center}
    .logo{height:24px;width:auto}
    h1{font-size:22px;margin:10px 0 6px}
    .sub{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.6}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    @media(max-width:720px){.grid{grid-template-columns:1fr}}
    .card{display:block;padding:14px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:inherit}
    .card:hover{border-color:rgba(56,189,248,.35);text-decoration:none;filter:brightness(1.04)}
    .card-title{font-weight:800;margin:0 0 6px}
    .card-desc{color:rgba(229,231,235,.86);font-size:13px;line-height:1.5}
    .foot{margin-top:18px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="brand">
        <a href="/" aria-label="CoinRader ホーム">
          <img class="logo" src="/assets/icons/logo_horizontal_v4.png" alt="CoinRader">
        </a>
        <div style="color:var(--muted);font-size:13px">CoinRader / Dictionary</div>
      </div>
      <div>
        <a href="/daily/" style="font-size:12px;border:1px solid rgba(255,255,255,.14);padding:6px 10px;border-radius:999px;color:var(--fg);background:rgba(255,255,255,.04)">Daily一覧</a>
      </div>
    </div>

    <h1>用語集</h1>
    <div class="sub">CoinRaderで頻出の指標・用語を、短く分かりやすくまとめます。</div>

    <div class="grid">
      {{ROWS}}
    </div>

    <div class="foot">Lastmod: {{LASTMOD}}</div>
  </div>
</body>
</html>
