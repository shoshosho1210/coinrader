<body>
  <div class="wrap">

    <header class="appHeader">

          <button class="btn" type="button" id="langToggle" aria-label="Switch language" aria-pressed="false">EN</button>

    <main>
      <h1 data-i18n data-ja="時価総額（Market Cap）" data-en="Market Cap">時価総額（Market Cap）</h1>

        </p>

             data-ja="CoinRaderでは、時価総額ランキング（TOP）と出来高などをセットで見て「資金が集まっている場所」を確認するのが基本です。"
             data-en="On CoinRader, the basic approach is to view market-cap ranks together with volume and trend to see where capital is concentrating.">
          CoinRaderでは、時価総額ランキング（TOP）と出来高などをセットで見て「資金が集まっている場所」を確認するのが基本です。

  <script>
  (function(){
    const btn = document.getElementById('langToggle');
    if(!btn) return;
    const KEY = 'cr_lang';
    const saved = localStorage.getItem(KEY) || 'ja';

    function apply(lang){
      document.documentElement.lang = lang;
      btn.textContent = (lang === 'en') ? 'JP' : 'EN';
      btn.setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');

      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const ja = el.getAttribute('data-ja');
        const en = el.getAttribute('data-en');
        if(!ja || !en) return;
        el.innerHTML = (lang === 'en') ? en : ja;
      });
    }

    btn.addEventListener('click', ()=>{
      const next = (document.documentElement.lang === 'en') ? 'ja' : 'en';
      localStorage.setItem(KEY, next);
      apply(next);
    });

    apply(saved);
  })();
  </script>
